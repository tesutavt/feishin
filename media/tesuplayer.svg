<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6a0f6"/>
      <stop offset="0.55" stop-color="#b7bdf8"/>
      <stop offset="1" stop-color="#8aadf4"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#363a4f"/>
      <stop offset="1" stop-color="#1e2030"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5bde6"/>
      <stop offset="1" stop-color="#c6a0f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1e2030" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>

  <!-- vinyl disc -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="512" r="330" fill="url(#disc)"/>
  </g>
  <circle cx="512" cy="512" r="290" fill="none" stroke="#494d64" stroke-width="6" opacity="0.8"/>
  <circle cx="512" cy="512" r="245" fill="none" stroke="#494d64" stroke-width="6" opacity="0.6"/>
  <circle cx="512" cy="512" r="200" fill="none" stroke="#494d64" stroke-width="6" opacity="0.4"/>
  <path d="M300 330 A300 300 0 0 1 470 222" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.25"/>

  <!-- play button -->
  <path d="M452 392 Q452 360 480 376 L640 476 Q668 494 640 512 L480 612 Q452 628 452 596 Z"
        transform="translate(0 0)" fill="url(#play)"/>

  <!-- sparkle -->
  <path d="M790 170 Q800 230 860 240 Q800 250 790 310 Q780 250 720 240 Q780 230 790 170 Z" fill="#ffffff"/>
  <path d="M215 760 Q221 795 256 801 Q221 807 215 842 Q209 807 174 801 Q209 795 215 760 Z" fill="#ffffff" opacity="0.85"/>
</svg>
